name: Repair wallet UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: automated wallet repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply repair
        run: python scripts/repair-wallet-ui.py
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/style.css scripts/repair-wallet-ui.py
          git diff --cached --quiet && exit 0
          git commit -m 'chore: automated wallet repair'
          git push
