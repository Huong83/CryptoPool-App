
name: Deploy CryptoPool to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair wallet UI before build
        if: ${{ hashFiles('scripts/repair-wallet-ui.py') != '' }}
        run: python3 scripts/repair-wallet-ui.py

      - name: Commit repaired source
        if: ${{ hashFiles('scripts/repair-wallet-ui.py') == '' && github.event.head_commit.message != 'chore: automated wallet repair' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/style.css scripts/repair-wallet-ui.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: automated wallet repair'
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
